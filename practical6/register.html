
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1>StudentHub</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html" aria-current="page">Registration</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
        </nav>
    </header>

    <main class="container">
        <section class="form-card">
            <h2>Student Registration</h2>

            <form id="registerForm" novalidate>
                <div class="form-grid">
                    <div>
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname"
                               placeholder="Enter your full name" required>
                        <span class="error-message" id="fullnameError"></span>
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" required>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div>
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile"
                               placeholder="10-digit mobile number"
                               maxlength="10" required>
                        <span class="error-message" id="mobileError"></span>
                    </div>

                    <div>
                        <label for="course">Course</label>
                        <select id="course" name="course" required>
                            <option value="">Select Course</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Engineering">Computer Engineering</option>
                            <option value="BSc IT">BSc IT</option>
                            <option value="BBA">BBA</option>
                        </select>
                        <span class="error-message" id="courseError"></span>
                    </div>

                    <div>
                        <label for="year">Academic Year</label>
                        <select id="year" name="year" required>
                            <option value="">Select Year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                        <span class="error-message" id="yearError"></span>
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               placeholder="Create a password" required>
                        <span class="error-message" id="passwordError"></span>
                        <div class="strength-bar">
                            <span id="strengthBar"></span>
                        </div>
                        <p class="password-strength" id="passwordStrength">
                            Password strength: Not entered
                        </p>
                    </div>

                    <div>
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" name="confirm"
                               placeholder="Re-enter password" required>
                        <span class="error-message" id="confirmError"></span>
                    </div>
                </div>

                <div class="form-option">
                    <p><strong>Gender</strong></p>
                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>
                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>
                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>
                    <span class="error-message" id="genderError"></span>
                </div>

                <div class="form-option">
                    <label>
                        <input type="checkbox" id="terms" name="terms">
                        I accept the terms and conditions.
                    </label>
                    <span class="error-message" id="termsError"></span>
                </div>

                <button type="submit">Register</button>
                <button type="reset">Reset</button>

                <p id="registerSuccess" class="success-message" hidden></p>
            </form>

            <p>Already registered? <a href="login.html">Go to Login</a></p>
        </section>
    </main>

    <footer>
        <p>StudentHub | 25CE011</p>
    </footer>

    <script src="js/register.js"></script>
</body>
</html>
